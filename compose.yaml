name: vic

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging
    environment:
      VIC_APP_NAME: ${VIC_APP_NAME:-VIC API}
      VIC_ENVIRONMENT: production
      VIC_DATABASE_URL: sqlite:////data/vic.db
      VIC_JWT_SECRET: ${VIC_JWT_SECRET:-change-this-secret-before-production}
      VIC_JWT_ALGORITHM: ${VIC_JWT_ALGORITHM:-HS256}
      VIC_TOKEN_EXPIRATION_MINUTES: ${VIC_TOKEN_EXPIRATION_MINUTES:-1440}
      VIC_RECOVERY_EXPIRATION_MINUTES: ${VIC_RECOVERY_EXPIRATION_MINUTES:-15}
      VIC_RECOVERY_MAX_REQUESTS_PER_HOUR: ${VIC_RECOVERY_MAX_REQUESTS_PER_HOUR:-3}
      VIC_RECOVERY_EMAIL_COOLDOWN_SECONDS: ${VIC_RECOVERY_EMAIL_COOLDOWN_SECONDS:-60}
      VIC_RECOVERY_MAX_CODE_ATTEMPTS: ${VIC_RECOVERY_MAX_CODE_ATTEMPTS:-5}
      VIC_EMAIL_VERIFICATION_EXPIRATION_MINUTES: ${VIC_EMAIL_VERIFICATION_EXPIRATION_MINUTES:-15}
      VIC_EMAIL_VERIFICATION_MAX_REQUESTS_PER_HOUR: ${VIC_EMAIL_VERIFICATION_MAX_REQUESTS_PER_HOUR:-3}
      VIC_EMAIL_VERIFICATION_COOLDOWN_SECONDS: ${VIC_EMAIL_VERIFICATION_COOLDOWN_SECONDS:-60}
      VIC_EMAIL_VERIFICATION_MAX_CODE_ATTEMPTS: ${VIC_EMAIL_VERIFICATION_MAX_CODE_ATTEMPTS:-5}
      VIC_CORS_ORIGINS: ${VIC_CORS_ORIGINS:-http://localhost:18080,http://127.0.0.1:18080}
      VIC_SMTP_HOST: ${VIC_SMTP_HOST:-}
      VIC_SMTP_PORT: ${VIC_SMTP_PORT:-587}
      VIC_SMTP_USERNAME: ${VIC_SMTP_USERNAME:-}
      VIC_SMTP_PASSWORD: ${VIC_SMTP_PASSWORD:-}
      VIC_SMTP_FROM_EMAIL: ${VIC_SMTP_FROM_EMAIL:-}
      VIC_SMTP_FROM_NAME: ${VIC_SMTP_FROM_NAME:-VIC}
      VIC_SMTP_USE_STARTTLS: ${VIC_SMTP_USE_STARTTLS:-true}
      VIC_SMTP_USE_SSL: ${VIC_SMTP_USE_SSL:-false}
      VIC_SQLITE_TIMEOUT_SECONDS: ${VIC_SQLITE_TIMEOUT_SECONDS:-15}
      VIC_HTTP_TIMEOUT_SECONDS: ${VIC_HTTP_TIMEOUT_SECONDS:-10}
      VIC_ROOT_PATH: /api
      VIC_ROUTING_URL: ${VIC_ROUTING_URL:-https://router.project-osrm.org}
      VIC_GEOCODING_URL: ${VIC_GEOCODING_URL:-https://nominatim.openstreetmap.org}
      VIC_EVIDENCE_DIR: /data/evidencias
      VIC_EVIDENCE_PUBLIC_URL: /evidencias
    volumes:
      - vic_data:/data
    ports:
      - "${VIC_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_URL: /api
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${VIC_WEB_PORT:-8080}:80"

volumes:
  vic_data:
    name: vic_data

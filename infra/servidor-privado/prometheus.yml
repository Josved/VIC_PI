global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vic-api-a
    metrics_path: /metricas
    static_configs:
      - targets: [backend-a:8000]

  - job_name: vic-api-b
    metrics_path: /metricas
    static_configs:
      - targets: [backend-b:8000]

  - job_name: servidor-privado
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: contenedores
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

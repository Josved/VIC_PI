name: vic-publico

services:
  puerta-publica:
    build:
      context: ../../frontend
      args:
        EXPO_PUBLIC_API_URL: /api
    image: vic-frontend-publico:latest
    init: true
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificados:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--no-check-certificate", "--spider", "https://127.0.0.1/salud-publica"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.10.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/textfile:ro
    pid: host
    ports:
      - "9100:9100"

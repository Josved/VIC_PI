name: vic-publico

services:
  puerta-publica:
    build:
      context: ../../frontend
      args:
        EXPO_PUBLIC_API_URL: /api
    image: vic-frontend-publico:latest
    init: true
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificados:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--no-check-certificate", "--spider", "https://127.0.0.1/salud-publica"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
